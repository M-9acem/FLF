# Small SLURM smoke test for GPU troubleshooting.
# Usage inside SLURM job:
#   python -u run_all_mixing_methods.py --experiments_yaml experiments_slurm_smoke.yaml

experiments:
  - name: slurm_smoke
    num_clients: 4
    rounds: 2
    epochs: 1
    delay_d: 0
    gossip_steps: 1
    dataset: mnist
    model: lenet5
    lr: 0.01
    momentum: 0.9
    weight_decay: 0.0
    batch_size: 64
    methods: [max_degree]
